    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulario Spelling Bee - Presentación</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;900&family=Inter:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #000000;
        }
        h1, h2, .title-font {
            font-family: 'Poppins', sans-serif;
        }
        .yellow-accent {
            background-color: #FFDE00;
            color: #000000;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-6 md:p-12 select-none">

    <header class="w-full max-w-4xl mx-auto flex flex-col md:flex-row justify-between items-center border-b-4 border-black pb-4 gap-4">
        <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-start">
            <div>
                <span id="category-badge" class="px-3 py-1 text-sm font-bold uppercase rounded-md yellow-accent border-2 border-black">Categoría</span>
                <span id="slide-progress" class="ml-3 font-bold text-gray-600 text-sm">Diapositiva 1 / 400</span>
            </div>
        </div>
        
        <!-- Buscador de Categorías -->
        <div class="flex items-center gap-2 w-full md:w-auto">
            <label for="category-select" class="text-xs font-black uppercase text-gray-700">Ir a:</label>
            <select id="category-select" onchange="jumpToCategory(this.value)" class="bg-white border-2 border-black px-3 py-1 font-bold text-sm rounded-lg shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] focus:outline-none cursor-pointer">
                <!-- Opciones cargadas dinámicamente -->
            </select>
        </div>
    </header>

    <main class="w-full max-w-4xl mx-auto my-auto flex flex-col items-center justify-center text-center py-8">
        <div id="slide-container" class="w-full max-w-2xl bg-white border-8 border-black p-8 md:p-12 rounded-2xl shadow-[12px_12px_0px_0px_rgba(0,0,0,1)] min-h-[420px] flex flex-col items-center justify-center transition-all duration-300">
            <!-- Dynamic Slide Content Inserted via JS -->
        </div>
    </main>

    <footer class="w-full max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4 pt-4 border-t-2 border-black">
        <div class="flex gap-3 w-full sm:w-auto">
            <button onclick="prevSlide()" class="flex-1 sm:flex-none px-6 py-3 font-black bg-white border-4 border-black rounded-xl shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:translate-x-0.5 hover:translate-y-0.5 hover:shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] active:translate-x-1 active:translate-y-1 active:shadow-none transition-all cursor-pointer">
                ← ANTERIOR
            </button>
            <button onclick="nextSlide()" class="flex-1 sm:flex-none px-8 py-3 font-black yellow-accent border-4 border-black rounded-xl shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:translate-x-0.5 hover:translate-y-0.5 hover:shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] active:translate-x-1 active:translate-y-1 active:shadow-none transition-all cursor-pointer">
                SIGUIENTE →
            </button>
        </div>
        <div class="text-sm font-bold text-gray-500">
            Usa las flechas del teclado (← / →) para avanzar o retroceder
        </div>
    </footer>

        let currentIndex = 0;
        const totalSlides = rawData.length * 4;

        function initCategorySelector() {
            const select = document.getElementById('category-select');
            const categories = [...new Set(rawData.map(item => item.cat))];
            
            select.innerHTML = '<option value="" disabled selected>Seleccionar...</option>';
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                select.appendChild(opt);
            });
        }

        function updateSlide() {
            const wordIndex = Math.floor(currentIndex / 4);
            const slideType = currentIndex % 4;
            const item = rawData[wordIndex];

            document.getElementById('category-badge').innerText = item.cat;
            document.getElementById('slide-progress').innerText = `Diapositiva ${currentIndex + 1} / ${totalSlides}`;
            
            document.getElementById('category-select').value = item.cat;

            const container = document.getElementById('slide-container');
            let contentHTML = '';

            if (slideType === 0) {
                // Diapositiva 1: Categoría
                contentHTML = `
                    <div class="text-sm font-bold text-gray-500 uppercase tracking-widest mb-3">Categoría</div>
                    <div class="text-4xl md:text-5xl font-black uppercase px-6 py-3 yellow-accent border-4 border-black inline-block rounded-xl shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">${item.cat}</div>
                `;
            } else if (slideType === 1) {
                // Diapositiva 2: Palabra en Inglés
                contentHTML = `
                    <div class="text-sm font-bold text-gray-500 uppercase tracking-widest mb-3">Palabra (English)</div>
                    <div class="text-5xl md:text-7xl font-black tracking-tight text-black">${item.en}</div>
                `;
            } else if (slideType === 2) {
                // Diapositiva 3: Referencia visual específica por tipo
                if (item.textOnly) {
                    contentHTML = `
                        <div class="text-sm font-bold text-gray-500 uppercase tracking-widest mb-3">Escritura</div>
                        <div class="text-4xl md:text-6xl font-black text-black px-6 py-4 border-4 border-black rounded-xl bg-gray-50 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">${item.en}</div>
                    `;
                } else if (item.colorCode) {
                    contentHTML = `
                        <div class="text-sm font-bold text-gray-500 uppercase tracking-widest mb-3">Color de Referencia</div>
                        <div class="w-48 h-48 md:w-56 md:h-56 mx-auto border-4 border-black rounded-xl shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] flex items-center justify-center ${item.border ? 'border-4 border-black' : ''}" style="background-color: ${item.colorCode};">
                        </div>
                    `;
                } else if (item.shapeSvg) {
                    contentHTML = `
                        <div class="text-sm font-bold text-gray-500 uppercase tracking-widest mb-3">Figura Geométrica</div>
                        <div class="w-48 h-48 md:w-56 md:h-56 mx-auto border-4 border-black rounded-xl shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] bg-gray-50 flex items-center justify-center">
                            ${item.shapeSvg}
                        </div>
                    `;
                } else {
                    contentHTML = `
                        <div class="text-sm font-bold text-gray-500 uppercase tracking-widest mb-3">Imagen de Referencia</div>
                        <div class="w-48 h-48 md:w-56 md:h-56 mx-auto border-4 border-black rounded-xl overflow-hidden shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] bg-gray-100 flex items-center justify-center">
                            <img src="${item.img}" alt="${item.en}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/400x400/FFDE00/000000?text=${item.en}'">
                        </div>
                    `;
                }
            } else if (slideType === 3) {
                // Diapositiva 4: Traducción en Español
                contentHTML = `
                    <div class="text-sm font-bold text-gray-500 uppercase tracking-widest mb-3">Traducción (Español)</div>
                    <div class="text-4xl md:text-6xl font-black uppercase text-black yellow-accent px-6 py-2 border-4 border-black rounded-xl shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">${item.es}</div>
                `;
            }

            container.innerHTML = contentHTML;
        }

        function nextSlide() {
            if (currentIndex < totalSlides - 1) {
                currentIndex++;
                updateSlide();
            }
        }

        function prevSlide() {
            if (currentIndex > 0) {
                currentIndex--;
                updateSlide();
            }
        }

        function jumpToCategory(categoryName) {
            const firstIndex = rawData.findIndex(item => item.cat === categoryName);
            if (firstIndex !== -1) {
                currentIndex = firstIndex * 4;
                updateSlide();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                prevSlide();
            }
        });

        window.onload = function() {
            initCategorySelector();
            updateSlide();
        };
    </script>
</body>
</html>
